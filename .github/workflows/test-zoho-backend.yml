name: Test Zoho Backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-zoho-backend.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test instrumented Zoho backend
        shell: bash
        run: |
          URL="https://07912092.elite-dance-studio-2026.pages.dev/api/form"
          echo "===== $URL ====="
          GET_CODE="$(curl -sS -o /tmp/get-body.txt -w "%{http_code}" "$URL" || true)"
          echo "GET_STATUS=$GET_CODE"
          cat /tmp/get-body.txt
          echo
          POST_CODE="$(curl -sS -o /tmp/post-body.txt -w "%{http_code}" \
            -X POST "$URL" \
            -H "Accept: application/json" \
            -F "form_kind=advanced" \
            -F "name=Elite Website Diagnostic" \
            -F "email=info@elitedancestudio.de" \
            -F "phone=+4900000000" \
            -F "months=November 2026" \
            -F "training_subject=Diagnostic test only" \
            -F "extra_note=Please ignore this diagnostic submission." \
            -F "privacy_consent=accepted" || true)"
          echo "POST_STATUS=$POST_CODE"
          cat /tmp/post-body.txt
          echo
