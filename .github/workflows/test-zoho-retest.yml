name: Temporary Zoho Retest

on:
  push:
    paths:
      - ".github/workflows/test-zoho-retest.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Submit test form
        run: |
          curl -sS -i -X POST "https://dee5c4de.elite-dance-studio-2026.pages.dev/api/form" \
            -F "form_kind=contact" \
            -F "name=Zoho Backend Test" \
            -F "email=test@example.com" \
            -F "topic=Backend test" \
            -F "message=Retest after refresh token update." \
            -F "privacy_consent=accepted"
