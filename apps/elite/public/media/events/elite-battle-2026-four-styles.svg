<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 875" role="img" aria-labelledby="title desc">
<title id="title">Elite Dance Battle 2026 — vier Kategorien, freier Eintritt für Zuschauer</title>
<desc id="desc">Breaking Kids, Breaking, Hip-Hop, House. 5 Dezember 2026 in Berlin-Moabit. Battles 12 bis 19 Uhr. Zuschauen kostenlos, Spenden freiwillig; optionaler USC-Check-in.</desc>
